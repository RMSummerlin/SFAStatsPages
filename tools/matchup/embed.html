  display:flex;gap:6px;margin:0 40px 6px 147px;text-align:center}
.pt-root.pt-mu .pt-glkey span{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden}

  function apart(p, q){ return deltaE(p.text, q.text) >= COLOR_MIN_DE && deltaE(p.fill, q.fill) >= COLOR_MIN_DE; }
  function gameColors(g){
    var A = candidates(COLORS[g.away] || ['#cc0000', '#cc0000', '#111111']);
    var H = candidates(COLORS[g.home] || ['#111111', '#111111', '#cc0000']);
    var ca = A[0], ch = H[0];
    outer: for (var i = 0; i < A.length; i++){

        if (apart(A[i], H[j])){ ca = A[i]; ch = H[j]; break outer; }

  function tint(hex, t){

  function ord(n){

  function fmtRate(v, kind){

  var D = null;

  function snapshotWeek(W){
    var best = D.snapshot_weeks[0];

      if (D.snapshot_weeks[i] <= W) best = D.snapshot_weeks[i];

  }
  function unitFor(W, team, side){

  }
  function leagueFor(W){
    var sw = snapshotWeek(W);

  }
  function ensureWeek(W){
    var sw = snapshotWeek(W);

  function mismatch(W, g){

  function openDetail(W, off, dfn, b, C){

    body.appendChild(el('div', 'pt-status', 'Loading\u2026'));

      body.innerHTML = '';

  function svg(w, h){
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    s.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    s.setAttribute('role', 'img');
    return s;
  }
  function node(tag, attrs, text){
    var n = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var k in attrs) if (attrs.hasOwnProperty(k)) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }
  var INK = '#111', G1 = '#4e5154', G2 = '#b0bec5', B2 = '#dde2e8';

  function dumbbell(part, uo, ud, L, off, dfn, C){
    var m = part[0], label = part[1], kind = part[2];
    var mo = uo.m[m], md = ud.m[m];
    var lo = L.off[m], ld = L.def[m];
    var mean = lo[0], sd = Math.max(lo[1], ld[1], 1e-6);
    var W = 320, H = 56, x0 = 12, x1 = W - 12, cx = (x0 + x1) / 2;
    var spread = 2.6 * sd;
    function X(v){ return Math.max(x0, Math.min(x1, cx + (v - mean) / spread * (x1 - x0) / 2)); }
    var box = el('div', 'pt-chart');
    var s = svg(W, H);
    s.appendChild(node('text', {x:cx, y:12, 'font-size':'11', 'font-weight':'700', fill:INK, 'text-anchor':'middle'}, label.toUpperCase()));
    s.appendChild(node('line', {x1:x0, y1:36, x2:x1, y2:36, stroke:B2, 'stroke-width':'2'}));
    s.appendChild(node('line', {x1:cx, y1:28, x2:cx, y2:44, stroke:INK, 'stroke-width':'2'}));
    s.appendChild(node('text', {x:x1, y:12, 'font-size':'11', fill:G1, 'text-anchor':'end'}, 'avg ' + fmtRate(mean, kind)));
    var vo = mo[0], vd = md[0];
    if (vo != null && vd != null){
      s.appendChild(node('line', {x1:X(vo), y1:36, x2:X(vd), y2:36, stroke:G2, 'stroke-width':'4'}));
    }
    var close = vo != null && vd != null && Math.abs(X(vo) - X(vd)) < 72;
    if (vo != null){
      s.appendChild(node('circle', {cx:X(vo), cy:36, r:6, fill:C[off].text}));
      s.appendChild(node('text', {x:X(vo), y:26, 'font-size':'11', 'font-weight':'700', fill:C[off].text, 'text-anchor':'middle'},
        off + ' ' + fmtRate(vo, kind) + (mo[3] ? ' (' + ord(mo[3]) + ')' : '')));
    }
    if (vd != null){
      s.appendChild(node('circle', {cx:X(vd), cy:36, r:6, fill:C[dfn].text}));
      s.appendChild(node('text', {x:X(vd), y:close ? 54 : 26, 'font-size':'11', 'font-weight':'700', fill:C[dfn].text, 'text-anchor':'middle'},
        dfn + ' ' + fmtRate(vd, kind) + (md[3] ? ' (' + ord(md[3]) + ')' : '')));
    }
    box.appendChild(s);
    return box;
  }

  function trendChart(key, off, dfn, W, C){
    var to = D.trend[off].off[key], td = D.trend[dfn].def[key];
    var weeks = D.snapshot_weeks;
    var n = weeks.length;
    var Wd = 320, H = 110, x0 = 30, x1 = Wd - 10, y0 = 10, y1 = H - 20;
    var vals = to.concat(td);
    var lo = Math.min(-1, Math.min.apply(null, vals)), hi = Math.max(1, Math.max.apply(null, vals));
    function X(i){ return n === 1 ? (x0 + x1) / 2 : x0 + (x1 - x0) * i / (n - 1); }
    function Y(v){ return y1 - (v - lo) / (hi - lo) * (y1 - y0); }
    var box = el('div', 'pt-chart');
    var s = svg(Wd, H);
    s.appendChild(node('line', {x1:x0, y1:Y(0), x2:x1, y2:Y(0), stroke:INK, 'stroke-width':'1'}));
    s.appendChild(node('text', {x:x0 - 4, y:Y(0) + 3, 'font-size':'11', fill:G1, 'text-anchor':'end'}, 'avg'));
    s.appendChild(node('text', {x:x0 - 4, y:y0 + 3, 'font-size':'11', fill:G1, 'text-anchor':'end'}, 'best'));
    s.appendChild(node('text', {x:x0 - 4, y:y1, 'font-size':'11', fill:G1, 'text-anchor':'end'}, 'worst'));
    var sw = snapshotWeek(W), si = weeks.indexOf(sw);
    if (si >= 0) s.appendChild(node('line', {x1:X(si), y1:y0, x2:X(si), y2:y1, stroke:B2, 'stroke-width':'6'}));
    weeks.forEach(function(w, i){
      if (i === 0 || i === n - 1 || (n > 6 && i % 3 === 0) || n <= 6){
        s.appendChild(node('text', {x:X(i), y:H - 6, 'font-size':'11', fill:G1, 'text-anchor':'middle'}, 'Wk' + w));
      }
    });
    function path(arr, color, dash){
      var d = '';
      arr.forEach(function(v, i){ d += (i ? ' L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); });
      var a = {d:d, fill:'none', stroke:color, 'stroke-width':'2.5', 'stroke-linejoin':'round'};
      if (dash) a['stroke-dasharray'] = '4 3';
      s.appendChild(node('path', a));
      arr.forEach(function(v, i){ s.appendChild(node('circle', {cx:X(i), cy:Y(v), r:3, fill:color})); });
    }
    path(to, C[off].text, false);
    path(td, C[dfn].text, true);
    box.appendChild(s);
    var leg = el('div', 'pt-legend');
    var a = el('span', null, '\u2014 ' + off + ' offense'); a.style.color = C[off].text;
    var b = el('span', null, '- - ' + dfn + ' defense'); b.style.color = C[dfn].text;
    leg.appendChild(a); leg.appendChild(b);
    box.appendChild(leg);
    return box;
  }

  function pairsTable(pairs, uo, ud, off, dfn, C){
    var t = el('table', 'pt-tend');
    var thead = el('thead');
    var hr = el('tr', 'hd');
    var h0 = el('th'), h1 = el('th', null, off + ' off'), h2 = el('th', null, dfn + ' def');
    h1.style.color = C[off].text; h2.style.color = C[dfn].text;
    hr.appendChild(h0); hr.appendChild(h1); hr.appendChild(h2);
    thead.appendChild(hr);
    t.appendChild(thead);
    var tb = el('tbody');
    pairs.forEach(function(p){
      if (p[0]) tb.appendChild(tendRow(p[2], p[0], 'pct', uo, ud));
      tb.appendChild(tendRow(p[3], p[1], p[1] === 'prsr' ? 'pct' : 'epa', uo, ud));
    });
    t.appendChild(tb);
    return t;
  }
  function tendRow(label, m, kind, uo, ud){
    var tr = el('tr');
    tr.appendChild(el('td', 'lab', label));
    [uo, ud].forEach(function(u){
      var mm = u.m[m];
      var td = el('td', 'n');
      if (!mm || mm[0] == null){
        td.textContent = '\u2013';
      } else if (mm[2] < MIN_SPLIT && D.snapshot_weeks.length > 1){
        td.textContent = '\u2013';
        td.className = 'n thin';
        td.title = mm[2] + ' plays';
      } else {
        td.textContent = fmtRate(mm[0], m === 'ttt' ? 'sec' : kind);
        if (mm[3]) td.appendChild(el('small', null, ord(mm[3])));
      }
      tr.appendChild(td);
    });
    return tr;
  }

  function openPicker(){
    var W = STATE.week;
    var body = openSheet('Week ' + W + ' games', 'Each bar takes the color of the team holding the edge');
    var sorts = el('div', 'pt-sorts');
    [['time', 'By kickoff'], ['mis', 'Biggest mismatch']].forEach(function(o){
      var b = el('button', 'pt-sort', o[1]);
      b.type = 'button';
      b.setAttribute('aria-pressed', STATE.sort === o[0] ? 'true' : 'false');
      b.addEventListener('click', function(){ STATE.sort = o[0]; openPicker(); });
      sorts.appendChild(b);
    });
    body.appendChild(sorts);
    var key = el('div', 'pt-glkey');
    D.battles.forEach(function(b){ key.appendChild(el('span', null, b.label.slice(0, 4))); });
    body.appendChild(key);
    var games = gamesIn(W).slice();
    if (STATE.sort === 'mis') games.sort(function(a, b){ return mismatch(W, b) - mismatch(W, a); });
    games.forEach(function(g){
      var C = gameColors(g);
      var row = el('button', 'pt-gl');
      row.type = 'button';
      if (g.id === STATE.game) row.setAttribute('aria-current', 'true');
      var nm = el('span', 'nm', gameLabel(g));
      var sub = (g.as != null && g.hs != null) ? 'Final ' + g.as + '-' + g.hs : fmtTime(g);
      nm.appendChild(el('small', null, g.id === STATE.game ? 'Showing \u00b7 ' + sub : sub));
      row.appendChild(nm);
      var strip = el('span', 'pt-strip');
      [[g.away, g.home], [g.home, g.away]].forEach(function(pair){
        var r = el('span', 'r');
        var lab = el('span', 't', pair[0] + ' O'); lab.style.color = C[pair[0]].text;
        r.appendChild(lab);
        D.battles.forEach(function(b){
          var e = edgeOf(W, pair[0], pair[1], b.key);
          var c = el('span', 'c');
          c.style.background = tint(e.e >= 0 ? C[pair[0]].fill : C[pair[1]].fill, Math.min(1, Math.abs(e.e) / 0.8));
          c.title = b.label + ': ' + edgeWord(e.e, pair[0], pair[1]);
          r.appendChild(c);
        });
        strip.appendChild(r);
      });
      row.appendChild(strip);
      row.appendChild(el('span', 'mis', mismatch(W, g).toFixed(1)));
      row.addEventListener('click', function(){
        STATE.game = g.id; STATE.side = 0;
        closeSheet(); render(); pushHash();
      });
      body.appendChild(row);
    });
    var note = el('div', 'pt-note');
    note.textContent = 'The number on the right totals all ten edges, so the mismatch sort surfaces the game with the most lopsided units.';
    body.appendChild(note);
  }

  function paintPick(g){
    $('pickname').textContent = g ? gameLabel(g) : 'Pick a game';
    $('picktime').textContent = g ? fmtTime(g) : '';
    $('wk').textContent = 'Week ' + STATE.week;
    var prev = $('prev'), next = $('next');
    prev.hidden = STATE.week <= 1;
    next.hidden = STATE.week >= maxWeek();
  }
  function paintFoot(W, g){
    var sw = snapshotWeek(W);
    var f = $('foot');
    var txt;
    if (sw === 1){
      txt = '<b>' + D.prior + ' baseline.</b> No ' + D.season + ' games yet, so every rating is last season\u2019s number ' +
        'pulled part of the way toward league average, since a team\u2019s strengths rarely carry over in full from one year ' +
        'to the next. A new starting quarterback or coordinator pulls it further.';
    } else {
      txt = '<b>Ratings through week ' + (sw - 1) + ' games.</b> Each rating blends ' + D.season + ' play with last season\u2019s ' +
        'baseline, with this season counting for more every week, adjusted for the opponents faced. Pale bars still lean on the baseline.';
    }
    f.innerHTML = txt + ' Ranks are 1 to 32. Tap any row for the numbers behind it.';
  }
  function pushHash(){
    var g = gameById(STATE.game);
    if (!g || !window.history || !history.replaceState) return;
    try {
      history.replaceState(null, '', '#w' + STATE.week + '-' + g.away.toLowerCase() + '-' + g.home.toLowerCase());
    } catch (e) {}
  }
  function readHash(){
    var m = /^#w(\d{1,2})-([a-z]{2,3})-([a-z]{2,3})$/.exec(location.hash || '');
    if (!m) return null;
    var w = parseInt(m[1], 10), a = m[2].toUpperCase(), h = m[3].toUpperCase();
    if (w > maxWeek()) return null;
    var g = gamesIn(w).filter(function(x){ return x.away === a && x.home === h; })[0];
    return g ? {week: w, game: g.id} : null;
  }
  function firstGame(W){
    var gs = gamesIn(W);
    return gs.length ? gs[0].id : null;
  }
  function setWeek(W){
    STATE.week = Math.max(1, Math.min(maxWeek(), W));
    STATE.game = firstGame(STATE.week);
    STATE.side = 0;
    render(); pushHash();
  }
  $('prev').addEventListener('click', function(){ setWeek(STATE.week - 1); });
  $('next').addEventListener('click', function(){ setWeek(STATE.week + 1); });
  $('pick').addEventListener('click', openPicker);

  function get(url){
    return fetch(url, {cache:'no-cache'}).then(function(r){
      if (!r.ok) throw new Error(url + ' returned ' + r.status);
      return r.json();
    });
  }

  if (window.ResizeObserver){
    var lastTier = null;
    new ResizeObserver(function(){
      if (!D) return;
      var tier = nameTier() + ':' + (ROOT.clientWidth >= 641 ? 'w' : 'n');
      if (tier === lastTier) return;
      lastTier = tier;
      render();
    }).observe(ROOT);
  }

  get(BASE + 'matchup_index.json').then(function(ix){
    if (!ix.seasons || !ix.seasons.length){
      showStatus('No seasons have matchup data yet.');
      return;
    }
    var season = ix.default || Math.max.apply(null, ix.seasons);
    return get(BASE + 'matchup_' + season + '.json').then(function(blob){
      D = blob;
      var h = readHash();
      if (h){
        STATE.week = h.week; STATE.game = h.game;
      } else {
        STATE.week = maxWeek();
        STATE.game = firstGame(STATE.week);
      }
      if (!STATE.game){
        showStatus('No games on the schedule for week ' + STATE.week + '.');
        return;
      }
      render();
    });
  }).catch(function(err){
    $('pickname').textContent = 'Live data unavailable';
    showStatus('Couldn\u2019t load the live data. The table below still carries this week\u2019s ranks and edges. ' +
      'Reload the page to try the interactive version again.');
    if (window.console) console.error('[matchup]', err);
  });
})();
</script>
