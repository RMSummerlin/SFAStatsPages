<style>
/* Weekly Matchups
   Every selector is scoped under .pt-root.pt-mu. See docs/avada-embed-rules.md.
   .pt-mu is this tool's own namespace so it cannot collide with the pace (.pt-pc)
   or personnel (.pt-pg) tool if two ever share a page. */
/* Scoping stops our styles leaking out; it does not stop the theme's leaking in.
   Declare font and color on every table element explicitly or Avada's th/td
   rules win by specificity. The card itself is divs; tables only appear in the
   bottom sheet's tendency panel. */
.pt-root.pt-mu *{box-sizing:border-box;margin:0;padding:0;font-family:inherit;color:inherit}
.pt-root.pt-mu table,.pt-root.pt-mu thead,.pt-root.pt-mu tbody,.pt-root.pt-mu tfoot,
.pt-root.pt-mu tr,.pt-root.pt-mu th,.pt-root.pt-mu td,.pt-root.pt-mu caption{
  font:inherit;color:inherit;background:none;border:0;text-align:inherit;
  text-transform:none;letter-spacing:normal;text-shadow:none;box-shadow:none;
  vertical-align:middle;width:auto;height:auto}
.pt-root.pt-mu{
  --red:#cc0000; --ink:#111; --g1:#7f8c9a; --g2:#b0bec5;
  --b1:#cdd5de; --b2:#dde2e8; --bg:#f4f5f7; --bg2:#f9fafb; --w:#fff;
  font-family:'Interstate Condensed','Interstate','Roboto Condensed','Arial Narrow',
    'Helvetica Neue',Arial,sans-serif;
  color:var(--ink); background:var(--w);
  border:1px solid var(--b1); line-height:1.25;
  position:relative;
  display:flex; flex-direction:column;
  max-height:1000px;
  max-height:clamp(1000px,120vh,1320px);
  max-height:clamp(1000px,120svh,1320px);
  overflow:hidden;
  font-variant-numeric:tabular-nums;
}
/* The desktop clamp floor is taller than a phone. Without this override the
   footer and the bottom sheet sit below the fold on a 700px viewport. */
@media (max-width:640px){
  .pt-root.pt-mu{max-height:85vh;max-height:85svh}
}
.pt-root.pt-mu input,.pt-root.pt-mu select,.pt-root.pt-mu button,.pt-root.pt-mu textarea{
  font:inherit;color:inherit;letter-spacing:inherit;text-transform:none}
.pt-root.pt-mu button{background:none;border:0;cursor:pointer}
.pt-root.pt-mu :focus-visible{outline:2px solid var(--red);outline-offset:1px}
.pt-root.pt-mu [hidden]{display:none !important}

/* ---------- masthead ---------- */
.pt-root.pt-mu .pt-head{flex:0 0 auto;padding:12px 12px 0;border-bottom:2px solid var(--ink)}
.pt-root.pt-mu .pt-title{font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.pt-root.pt-mu .pt-sub{margin-top:3px;font-size:13px;color:var(--g1)}
.pt-root.pt-mu .pt-sub b{color:var(--ink);font-weight:700}
.pt-root.pt-mu .pt-nav{display:flex;align-items:stretch;gap:6px;margin:10px 0 10px}
.pt-root.pt-mu .pt-wk{min-height:44px;min-width:44px;border:1px solid var(--b1);font-size:18px;
  font-weight:700;background:var(--w)}
.pt-root.pt-mu .pt-wk:disabled{color:var(--g2);cursor:default}
.pt-root.pt-mu .pt-wklabel{min-height:44px;min-width:76px;display:flex;align-items:center;
  justify-content:center;border:1px solid var(--b1);border-left:0;border-right:0;
  font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.pt-root.pt-mu .pt-pick{flex:1;min-height:44px;padding:0 12px;border:1px solid var(--ink);
  background:var(--ink);color:var(--w);display:flex;align-items:center;justify-content:space-between;
  font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;text-align:left}
.pt-root.pt-mu .pt-pick .c{font-size:9px;letter-spacing:.1em;color:var(--g2);margin-left:8px}

/* ---------- card ---------- */
.pt-root.pt-mu .pt-wrap{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.pt-root.pt-mu .pt-card{padding:10px 12px 12px}
.pt-root.pt-mu .pt-game{display:flex;align-items:stretch;gap:8px;padding-bottom:10px;
  border-bottom:1px solid var(--b2)}
.pt-root.pt-mu .pt-teamblk{flex:1;display:flex;flex-direction:column;gap:2px}
.pt-root.pt-mu .pt-teamblk.r{text-align:right;align-items:flex-end}
.pt-root.pt-mu .pt-tname{font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pt-root.pt-mu .pt-tqb{font-size:11px;color:var(--g1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pt-root.pt-mu .pt-tqb .new{color:var(--red);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:9px}
.pt-root.pt-mu .pt-ranks{display:flex;gap:10px;margin-top:4px}
.pt-root.pt-mu .pt-teamblk.r .pt-ranks{flex-direction:row-reverse}
.pt-root.pt-mu .pt-rk .k{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--g1)}
.pt-root.pt-mu .pt-rk .n{font-size:22px;font-weight:700;line-height:1;margin-top:1px}
.pt-root.pt-mu .pt-rk .n small{font-size:11px;font-weight:700;color:var(--g1)}
.pt-root.pt-mu .pt-at{align-self:center;font-size:11px;font-weight:700;color:var(--g2);
  text-transform:uppercase;letter-spacing:.08em;text-align:center;min-width:34px}
.pt-root.pt-mu .pt-when{font-size:11px;color:var(--g1);text-align:center;margin-top:6px}
.pt-root.pt-mu .pt-when b{color:var(--ink);font-weight:700}
.pt-root.pt-mu .pt-final{font-size:11px;color:var(--g1);text-align:center;margin-top:3px}
.pt-root.pt-mu .pt-final b{color:var(--ink);font-weight:700}

/* Side toggle: one side of the ball at a time on a phone. */
.pt-root.pt-mu .pt-sides{display:flex;margin:10px 0 6px;border:1px solid var(--b1)}
.pt-root.pt-mu .pt-side{flex:1;min-height:44px;padding:0 8px;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;color:var(--g1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-root.pt-mu .pt-side+.pt-side{border-left:1px solid var(--b1)}
.pt-root.pt-mu .pt-side[aria-pressed="true"]{background:var(--ink);color:var(--w)}

/* Battle rows. Each is a button so the pop-out works on tap, not hover. */
.pt-root.pt-mu .pt-panel{display:block}
.pt-root.pt-mu .pt-panel[data-off="1"]{display:none}
.pt-root.pt-mu .pt-ptitle{display:none;font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--g1);margin:8px 0 4px}
.pt-root.pt-mu .pt-cols{display:flex;font-size:9px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--g1);padding:4px 0 2px;border-bottom:2px solid var(--ink)}
.pt-root.pt-mu .pt-cols .l{width:74px}
.pt-root.pt-mu .pt-cols .o{width:46px;text-align:right;white-space:nowrap}
.pt-root.pt-mu .pt-cols .t{flex:1;text-align:center}
.pt-root.pt-mu .pt-cols .d{width:46px;text-align:left;white-space:nowrap}
.pt-root.pt-mu .pt-row{display:flex;align-items:center;width:100%;min-height:46px;
  border-bottom:1px solid var(--b2);text-align:left}
.pt-root.pt-mu .pt-row:active{background:var(--bg2)}
.pt-root.pt-mu .pt-row .l{width:74px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
  line-height:1.1}
.pt-root.pt-mu .pt-row .l small{display:block;font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--g1);margin-top:2px}
.pt-root.pt-mu .pt-row .o,.pt-root.pt-mu .pt-row .d{width:46px;font-size:15px;font-weight:700;white-space:nowrap}
.pt-root.pt-mu .pt-row .o{text-align:right;padding-right:6px}
.pt-root.pt-mu .pt-row .d{text-align:left;padding-left:6px}
.pt-root.pt-mu .pt-row .o sup,.pt-root.pt-mu .pt-row .d sup{font-size:9px;color:var(--g1);vertical-align:top;line-height:1;margin-left:1px}
/* The track. Centre tick is average; the fill grows from the centre toward
   whichever side holds the edge. Length is |offense percentile - defense
   percentile|, so a 1st-ranked offense against a 32nd-ranked defense fills the
   whole offense half. The fill's opacity is the share of this season's data
   behind the rating; a hatched fill means the rating is still mostly last
   season's baseline. */
.pt-root.pt-mu .pt-track{display:block;position:relative;height:16px;background:var(--bg);border:1px solid var(--b2)}
.pt-root.pt-mu .pt-track .mid{display:block;position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink)}
.pt-root.pt-mu .pt-track .fill{display:block;position:absolute;top:2px;bottom:2px}
.pt-root.pt-mu .pt-track .fill.fo{right:50%;background:var(--red)}
.pt-root.pt-mu .pt-track .fill.fd{left:50%;background:var(--g1)}
.pt-root.pt-mu .pt-track .fill.base{background-image:repeating-linear-gradient(135deg,transparent 0 3px,rgba(255,255,255,.6) 3px 5px)}
.pt-root.pt-mu .pt-track .q{display:block;position:absolute;top:0;bottom:0;width:1px;background:var(--b1)}
.pt-root.pt-mu .pt-edge{display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--g1);text-align:center;margin-top:3px}
.pt-root.pt-mu .pt-edge.eo{color:var(--red)}
.pt-root.pt-mu .pt-edge.ed{color:var(--ink)}
.pt-root.pt-mu .pt-trackwrap{display:block;flex:1;min-width:0;padding:0 2px}
.pt-root.pt-mu .pt-key{display:flex;justify-content:center;gap:14px;font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;color:var(--g1);margin-top:8px}
.pt-root.pt-mu .pt-key .o{color:var(--red)}
.pt-root.pt-mu .pt-basis{font-size:11px;color:var(--g1);margin-top:8px;line-height:1.35}
.pt-root.pt-mu .pt-basis b{color:var(--ink);font-weight:700}
.pt-root.pt-mu .pt-chip{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;padding:2px 5px;border:1px solid var(--red);color:var(--red);margin-left:6px;vertical-align:middle}

/* ---------- bottom sheet (battle detail, game picker) ---------- */
.pt-root.pt-mu .pt-scrim{position:absolute;left:0;top:0;right:0;bottom:0;z-index:39;background:rgba(17,17,17,.35)}
.pt-root.pt-mu .pt-sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;max-height:82%;
  display:flex;flex-direction:column;background:var(--w);border-top:2px solid var(--ink);
  box-shadow:0 -6px 20px rgba(0,0,0,.18)}
.pt-root.pt-mu .pt-shead{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:8px 12px;border-bottom:1px solid var(--b2)}
.pt-root.pt-mu .pt-shead .h{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1.15}
.pt-root.pt-mu .pt-shead .h small{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--g1);margin-top:2px}
.pt-root.pt-mu .pt-close{flex:0 0 auto;min-height:44px;min-width:44px;font-size:22px;font-weight:700;color:var(--g1)}
.pt-root.pt-mu .pt-sbody{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 12px}
.pt-root.pt-mu .pt-sec{margin-bottom:14px}
.pt-root.pt-mu .pt-sec:last-child{margin-bottom:0}
.pt-root.pt-mu .pt-stitle{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--g1);margin-bottom:6px;padding-bottom:3px;border-bottom:1px solid var(--b2)}
/* Cap the whole block, not just the SVG, or the chart centres while its note stays full width. */
.pt-root.pt-mu .pt-chart{max-width:460px;margin:0 auto 8px}
.pt-root.pt-mu .pt-chart svg{display:block;width:100%;height:auto}
.pt-root.pt-mu .pt-note{font-size:11px;color:var(--g1);margin-top:5px;line-height:1.35}
.pt-root.pt-mu .pt-note b{color:var(--ink);font-weight:700}
.pt-root.pt-mu .pt-tend{width:100%;border-collapse:collapse;font-size:12px}
.pt-root.pt-mu .pt-tend th,.pt-root.pt-mu .pt-tend td{padding:6px 4px;border-bottom:1px solid var(--b2);white-space:nowrap}
.pt-root.pt-mu .pt-tend th{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--g1);text-align:left}
.pt-root.pt-mu .pt-tend td.n{text-align:right;font-weight:700}
.pt-root.pt-mu .pt-tend td.n small{font-weight:400;color:var(--g1);margin-left:3px}
.pt-root.pt-mu .pt-tend td.lab{color:var(--g1);font-size:11px;white-space:normal}
.pt-root.pt-mu .pt-tend td.thin{color:var(--g2)}
.pt-root.pt-mu .pt-tend tr.hd th{border-bottom:2px solid var(--ink)}

/* Game list inside the picker sheet. */
.pt-root.pt-mu .pt-sorts{display:flex;gap:6px;margin-bottom:8px}
.pt-root.pt-mu .pt-sort{min-height:40px;padding:0 12px;border:1px solid var(--b1);font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;color:var(--g1);background:var(--w)}
.pt-root.pt-mu .pt-sort[aria-pressed="true"]{background:var(--ink);color:var(--w);border-color:var(--ink)}
.pt-root.pt-mu .pt-gl{width:100%;display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 0;
  border-bottom:1px solid var(--b2);text-align:left}
.pt-root.pt-mu .pt-gl[aria-current="true"] .nm{color:var(--red)}
.pt-root.pt-mu .pt-gl .nm{width:92px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.pt-root.pt-mu .pt-gl .nm small{display:block;font-size:10px;font-weight:400;letter-spacing:0;color:var(--g1);text-transform:none;margin-top:2px}
.pt-root.pt-mu .pt-strip{flex:1;display:flex;flex-direction:column;gap:3px}
.pt-root.pt-mu .pt-strip .r{display:flex;align-items:center;gap:3px}
.pt-root.pt-mu .pt-strip .r .t{width:36px;font-size:9px;font-weight:700;color:var(--g1);letter-spacing:.04em}
.pt-root.pt-mu .pt-strip .c{flex:1;height:12px;border:1px solid var(--b2);background:var(--bg)}
.pt-root.pt-mu .pt-strip .mis{width:34px;text-align:right;font-size:11px;font-weight:700;color:var(--g1)}
.pt-root.pt-mu .pt-glkey{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--g1);
  display:flex;gap:6px;margin:0 40px 6px 139px}
.pt-root.pt-mu .pt-glkey span{flex:1;text-align:center}

/* ---------- status + footer ---------- */
.pt-root.pt-mu .pt-status{padding:26px 14px;text-align:center;font-size:13px;color:var(--g1)}
.pt-root.pt-mu .pt-foot{flex:0 0 auto;padding:8px 12px;border-top:1px solid var(--b2);
  background:var(--bg2);font-size:11px;color:var(--g1);line-height:1.35}
.pt-root.pt-mu .pt-foot b{color:var(--ink);font-weight:700}
.pt-root.pt-mu .pt-foot summary{cursor:pointer;font-weight:700;color:var(--ink);min-height:24px}
.pt-root.pt-mu .pt-foot details p{margin-top:4px}

/* ---------- desktop enhancement ---------- */
@media (min-width:641px){
  .pt-root.pt-mu .pt-title{font-size:25px}
  .pt-root.pt-mu .pt-tname{font-size:20px}
  .pt-root.pt-mu .pt-rk .n{font-size:26px}
  .pt-root.pt-mu .pt-sides{display:none}
  .pt-root.pt-mu .pt-panels{display:flex;gap:18px}
  .pt-root.pt-mu .pt-panel{flex:1;min-width:0}
  .pt-root.pt-mu .pt-panel[data-off="1"]{display:block}
  .pt-root.pt-mu .pt-ptitle{display:block}
  .pt-root.pt-mu .pt-row .l{width:84px;font-size:14px}
  .pt-root.pt-mu .pt-cols .l{width:84px}
  .pt-root.pt-mu .pt-sheet{left:8%;right:8%;max-height:86%}
  .pt-root.pt-mu .pt-gl .nm{width:150px}
  .pt-root.pt-mu .pt-glkey{margin-left:197px}
  .pt-root.pt-mu .pt-tend{font-size:13px}
}
</style>

<div class="pt-root pt-mu">
  <div class="pt-head">
    <div class="pt-title">NFL Weekly Matchups</div>
    <div class="pt-sub" data-role="sub">Loading matchup data…</div>
    <div class="pt-nav">
      <button type="button" class="pt-wk" data-role="prev" aria-label="Previous week">&#8249;</button>
      <div class="pt-wklabel" data-role="wk">Week</div>
      <button type="button" class="pt-wk" data-role="next" aria-label="Next week">&#8250;</button>
      <button type="button" class="pt-pick" data-role="pick" aria-haspopup="dialog"><span data-role="pickname">Pick a game</span><span class="c">Games &#9662;</span></button>
    </div>
  </div>

  <div class="pt-wrap" data-role="wrap"></div>

  <div class="pt-scrim" data-role="scrim" hidden></div>
  <div class="pt-sheet" data-role="sheet" role="dialog" aria-modal="true" hidden></div>

  <div class="pt-foot" data-role="foot"></div>
</div>

<script>
(function(){
  'use strict';

  var ROOT = document.currentScript && document.currentScript.previousElementSibling;
  if (!ROOT || !ROOT.classList.contains('pt-mu')) {
    var all = document.querySelectorAll('.pt-root.pt-mu');
    ROOT = all[all.length - 1];
  }
  if (!ROOT || ROOT.getAttribute('data-init') === '1') return;
  ROOT.setAttribute('data-init', '1');

  var BASE = 'https://rmsummerlin.github.io/SFAStatsPages/data/';
  // Must match the key in data/preloads.json and the shortcode's tool name in
  // wordpress/sfa-preloads.php.
  var TOOL = 'matchup';

  // Edge thresholds, in percentile difference. Half the track is 1.0.
  var EDGE_BIG = 0.5, EDGE_SOME = 0.25;
  // Below this share of current-season data the fill is hatched: the rating is
  // still mostly last season's regressed baseline.
  var BASELINE_SHARE = 0.25;
  // Splits with fewer plays than this show a dash. The blend still produces a
  // number, but it is nearly all prior and the reader should know that.
  var MIN_SPLIT = 40;

  var NAMES = {
    ARI:['Arizona Cardinals','Cardinals'], ATL:['Atlanta Falcons','Falcons'],
    BAL:['Baltimore Ravens','Ravens'], BUF:['Buffalo Bills','Bills'],
    CAR:['Carolina Panthers','Panthers'], CHI:['Chicago Bears','Bears'],
    CIN:['Cincinnati Bengals','Bengals'], CLE:['Cleveland Browns','Browns'],
    DAL:['Dallas Cowboys','Cowboys'], DEN:['Denver Broncos','Broncos'],
    DET:['Detroit Lions','Lions'], GB:['Green Bay Packers','Packers'],
    HOU:['Houston Texans','Texans'], IND:['Indianapolis Colts','Colts'],
    JAX:['Jacksonville Jaguars','Jaguars'], KC:['Kansas City Chiefs','Chiefs'],
    LAC:['Los Angeles Chargers','Chargers'], LAR:['Los Angeles Rams','Rams'],
    LV:['Las Vegas Raiders','Raiders'], MIA:['Miami Dolphins','Dolphins'],
    MIN:['Minnesota Vikings','Vikings'], NE:['New England Patriots','Patriots'],
    NO:['New Orleans Saints','Saints'], NYG:['New York Giants','Giants'],
    NYJ:['New York Jets','Jets'], PHI:['Philadelphia Eagles','Eagles'],
    PIT:['Pittsburgh Steelers','Steelers'], SEA:['Seattle Seahawks','Seahawks'],
    SF:['San Francisco 49ers','49ers'], TB:['Tampa Bay Buccaneers','Buccaneers'],
    TEN:['Tennessee Titans','Titans'], WAS:['Washington Commanders','Commanders']
  };

  // What the sheet shows for each battle row: the metrics behind the score,
  // then the tendency-versus-counter pairs. [metric, label, format, kind]
  // kind: 'q' quality (ranked best-first, both sides), 't' tendency (rate).
  // Pairs are [defense tendency metric, offense counter metric] so the reader
  // sees "this defense does X a lot" next to "this offense handles X well".
  var DETAIL = {
    overall:   {parts:[['sr','Success rate','pct','q'],['epa','EPA per play','epa','q'],
                       ['early_sr','Early-down success','pct','q'],['third','Third-down conversion','pct','q']],
                pairs:[]},
    pass:      {parts:[['db_sr','Dropback success','pct','q'],['db_epa','EPA per dropback','epa','q']],
                pairs:[['blitz','blitz_epa','Blitz rate','EPA vs blitz'],
                       ['man','man_epa','Man coverage rate','EPA vs man'],
                       [null,'zone_epa','','EPA vs zone'],
                       ['pa','pa_epa','Play-action rate','Play-action EPA'],
                       ['deep','deep_epa','Deep target rate','Deep EPA']]},
    rush:      {parts:[['run_sr','Rush success','pct','q'],['run_epa','EPA per rush','epa','q'],
                       ['ybc','Yards before contact','yds','q'],['yac_run','Yards after contact','yds','q'],
                       ['xrun','Explosive run rate','pct','q']],
                pairs:[]},
    pressure:  {parts:[['prsr','Pressure rate','pct','q'],['sack','Sack rate','pct','q']],
                pairs:[['blitz','blitz_epa','Blitz rate','EPA vs blitz'],
                       ['ttt','prsr','Time to throw','Pressure rate']]},
    explosive: {parts:[['explo','Explosive play rate','pct','q'],['xpass','Explosive pass rate','pct','q'],
                       ['xrun','Explosive run rate','pct','q']],
                pairs:[['deep','deep_epa','Deep target rate','Deep EPA']]}
  };

  var $ = function(role){ return ROOT.querySelector('[data-role="' + role + '"]'); };
  var el = function(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  function nameTier(){
    var w = ROOT.clientWidth || 0;
    return w >= 900 ? 2 : w >= 560 ? 1 : 0;
  }
  function teamName(code, tier){
    var t = tier == null ? nameTier() : tier, n = NAMES[code];
    if (!n || t === 0) return code;
    return t === 2 ? n[0] : n[1];
  }
  function ord(n){
    if (n == null) return '';
    var s = ['th','st','nd','rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }
  function fmtRate(v, kind){
    if (v == null) return '\u2013';
    if (kind === 'pct') return Math.round(v * 100) + '%';
    if (kind === 'epa') return (v >= 0 ? '+' : '') + v.toFixed(2);
    if (kind === 'yds') return v.toFixed(2);
    if (kind === 'sec') return v.toFixed(2) + 's';
    return String(v);
  }
  function fmtTime(g){
    if (!g.time) return g.day || '';
    var p = g.time.split(':'), h = parseInt(p[0], 10), m = p[1] || '00';
    var ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return g.day + ' ' + h + ':' + m + ' ' + ampm + ' ET';
  }
  function fmtDate(iso){
    var p = iso.split('-');
    var mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(p[1], 10) - 1];
    return mo + ' ' + parseInt(p[2], 10);
  }

  /* The server-rendered preload table sits outside this fragment: it comes from
     the shortcode, so in Avada it is a sibling of the code block, not a child of
     ROOT. Hide it once the live tool has painted. If the data fetch fails,
     render() never runs and the table stays visible as the fallback.
     Matches hideServerPreload() in the other tools apart from the key. */
  var SEO_HIDDEN = false;
  function hideServerPreload(){
    if (SEO_HIDDEN) return;
    SEO_HIDDEN = true;
    var n = document.querySelectorAll('[data-sfa-preload="' + TOOL + '"]');
    for (var i = 0; i < n.length; i++) n[i].style.display = 'none';
  }
  function showStatus(text){
    var wrap = $('wrap');
    wrap.innerHTML = '';
    wrap.appendChild(el('div', 'pt-status', text));
  }

  var D = null;                 // matchup_<season>.json
  var WEEK_CACHE = {};          // as-of week -> snapshot ({units, league, w})
  var STATE = { week: 1, game: null, side: 0, sort: 'time' };

  // ---- data access -------------------------------------------------------

  // The snapshot a card for week W reads: as-of W, or the latest one built if
  // no games have been played since. Full detail for the latest snapshot ships
  // in the main file; earlier weeks are fetched on demand.
  function snapshotWeek(W){
    var best = D.snapshot_weeks[0];
    for (var i = 0; i < D.snapshot_weeks.length; i++){
      if (D.snapshot_weeks[i] <= W) best = D.snapshot_weeks[i];
    }
    return best;
  }
  function latestWeek(){ return D.snapshot_weeks[D.snapshot_weeks.length - 1]; }
  function battlesFor(W, team, side){
    var sw = snapshotWeek(W);
    if (sw === latestWeek()) return D.latest.units[team][side].b;
    var h = D.battle_history[String(sw)];
    return h ? h[team][side] : D.latest.units[team][side].b;
  }
  function unitFor(W, team, side){
    var sw = snapshotWeek(W);
    var snap = sw === latestWeek() ? D.latest : WEEK_CACHE[sw];
    return snap ? snap.units[team][side] : null;
  }
  function leagueFor(W){
    var sw = snapshotWeek(W);
    var snap = sw === latestWeek() ? D.latest : WEEK_CACHE[sw];
    return snap ? snap.league : D.latest.league;
  }
  function ensureWeek(W){
    var sw = snapshotWeek(W);
    if (sw === latestWeek() || WEEK_CACHE[sw]) return Promise.resolve();
    return get(BASE + 'matchup_' + D.season + '_w' + sw + '.json').then(function(blob){
      WEEK_CACHE[sw] = blob;
    });
  }
  function gamesIn(W){
    return D.schedule.filter(function(g){ return g.w === W; });
  }
  function gameById(id){
    for (var i = 0; i < D.schedule.length; i++) if (D.schedule[i].id === id) return D.schedule[i];
    return null;
  }
  function edgeOf(W, off, dfn, key){
    var o = battlesFor(W, off, 'off')[key], d = battlesFor(W, dfn, 'def')[key];
    return { e: o[2] - d[2], o: o, d: d };
  }
  function edgeWord(e){
    var a = Math.abs(e);
    if (a >= EDGE_BIG) return (e > 0 ? 'Big offense edge' : 'Big defense edge');
    if (a >= EDGE_SOME) return (e > 0 ? 'Offense edge' : 'Defense edge');
    return 'Even';
  }
  function mismatch(W, g){
    var s = 0;
    D.battles.forEach(function(b){
      s += Math.abs(edgeOf(W, g.away, g.home, b.key).e) + Math.abs(edgeOf(W, g.home, g.away, b.key).e);
    });
    return s;
  }
  function flagsFor(W, team){
    var u = unitFor(W, team, 'off');
    return u ? u.f : D.latest.units[team].off.f;
  }
  function shareFor(W, team, side){
    var b = battlesFor(W, team, side);
    return b.overall[3];
  }

  // ---- card ------------------------------------------------------------------

  function render(){
    var wrap = $('wrap');
    wrap.innerHTML = '';
    var W = STATE.week, g = gameById(STATE.game);
    if (!g){ showStatus('No game selected.'); return; }
    var card = el('div', 'pt-card');

    // Game header: both teams, overall ranks, kickoff, final if played.
    var head = el('div', 'pt-game');
    head.appendChild(teamBlock(W, g.away, false));
    head.appendChild(el('div', 'pt-at', g.neutral ? 'vs' : 'at'));
    head.appendChild(teamBlock(W, g.home, true));
    card.appendChild(head);

    var when = el('div', 'pt-when');
    var b = el('b', null, fmtDate(g.date) + ' \u00b7 ' + fmtTime(g));
    when.appendChild(b);
    if (g.stadium) when.appendChild(document.createTextNode(' \u00b7 ' + g.stadium));
    card.appendChild(when);

    var res = D.results[g.id];
    if (res && g.as != null && g.hs != null){
      var fin = el('div', 'pt-final');
      fin.innerHTML = '<b>Final ' + g.away + ' ' + g.as + ', ' + g.home + ' ' + g.hs + '</b>' +
        ' \u00b7 ' + g.away + ' offense ' + fmtRate(res[g.away][0], 'epa') + ' EPA/play, ' +
        g.home + ' offense ' + fmtRate(res[g.home][0], 'epa');
      card.appendChild(fin);
    }

    // Side toggle (phone) and the two panels.
    var sides = el('div', 'pt-sides');
    sides.setAttribute('role', 'group');
    [[g.away, g.home], [g.home, g.away]].forEach(function(pair, i){
      var btn = el('button', 'pt-side', pair[0] + ' off vs ' + pair[1] + ' def');
      btn.type = 'button';
      btn.setAttribute('aria-pressed', STATE.side === i ? 'true' : 'false');
      btn.addEventListener('click', function(){ STATE.side = i; render(); });
      sides.appendChild(btn);
    });
    card.appendChild(sides);

    var panels = el('div', 'pt-panels');
    panels.appendChild(panel(W, g.away, g.home, STATE.side !== 0));
    panels.appendChild(panel(W, g.home, g.away, STATE.side !== 1));
    card.appendChild(panels);

    var key = el('div', 'pt-key');
    key.innerHTML = '<span class="o">\u2190 Offense edge</span><span>Defense edge \u2192</span>';
    card.appendChild(key);

    card.appendChild(basisLine(W, g));
    wrap.appendChild(card);
    hideServerPreload();
    paintPick(g);
    paintFoot();
  }

  function teamBlock(W, team, right){
    var blk = el('div', 'pt-teamblk' + (right ? ' r' : ''));
    blk.appendChild(el('div', 'pt-tname', teamName(team, Math.min(nameTier(), 1))));
    var f = flagsFor(W, team);
    var qb = el('div', 'pt-tqb');
    qb.textContent = f.qb ? 'QB ' + f.qb : '';
    if (f.qb_new){
      var chip = el('span', 'new', f.qb_since ? ' New since wk ' + f.qb_since : ' New QB');
      qb.appendChild(chip);
    }
    blk.appendChild(qb);
    var ranks = el('div', 'pt-ranks');
    ['off', 'def'].forEach(function(side){
      var r = el('div', 'pt-rk');
      r.appendChild(el('div', 'k', side === 'off' ? 'Offense' : 'Defense'));
      var rk = battlesFor(W, team, side).overall[1];
      var n = el('div', 'n', String(rk));
      n.appendChild(el('small', null, ord(rk).replace(String(rk), '')));
      r.appendChild(n);
      ranks.appendChild(r);
    });
    blk.appendChild(ranks);
    return blk;
  }

  function panel(W, off, dfn, hidden){
    var p = el('div', 'pt-panel');
    if (hidden) p.setAttribute('data-off', '1');
    p.appendChild(el('div', 'pt-ptitle', off + ' offense vs ' + dfn + ' defense'));
    var cols = el('div', 'pt-cols');
    cols.innerHTML = '<span class="l"></span><span class="o">' + off + ' off</span><span class="t">Edge</span><span class="d">' + dfn + ' def</span>';
    p.appendChild(cols);
    D.battles.forEach(function(b){
      var e = edgeOf(W, off, dfn, b.key);
      var row = el('button', 'pt-row');
      row.type = 'button';
      row.setAttribute('aria-label', b.label + ': ' + off + ' offense ' + ord(e.o[1]) + ', ' + dfn + ' defense ' + ord(e.d[1]) + ', ' + edgeWord(e.e));
      var lab = el('span', 'l', b.label);
      row.appendChild(lab);
      var o = el('span', 'o'); o.innerHTML = e.o[1] + '<sup>' + ord(e.o[1]).replace(String(e.o[1]), '') + '</sup>';
      row.appendChild(o);
      var tw = el('span', 'pt-trackwrap');
      tw.appendChild(track(e.e, Math.min(e.o[3], e.d[3])));
      var ew = el('span', 'pt-edge' + (Math.abs(e.e) >= EDGE_SOME ? (e.e > 0 ? ' eo' : ' ed') : ''), edgeWord(e.e));
      tw.appendChild(ew);
      row.appendChild(tw);
      var d = el('span', 'd'); d.innerHTML = e.d[1] + '<sup>' + ord(e.d[1]).replace(String(e.d[1]), '') + '</sup>';
      row.appendChild(d);
      row.addEventListener('click', function(){ openDetail(W, off, dfn, b); });
      p.appendChild(row);
    });
    return p;
  }

  function track(edge, share){
    var t = el('span', 'pt-track');
    [0.25, 0.75].forEach(function(q){
      var m = el('span', 'q'); m.style.left = (q * 100) + '%'; t.appendChild(m);
    });
    var fill = el('span', 'fill ' + (edge >= 0 ? 'fo' : 'fd') + (share < BASELINE_SHARE ? ' base' : ''));
    fill.style.width = (Math.min(1, Math.abs(edge)) * 50) + '%';
    fill.style.opacity = String(0.55 + 0.45 * Math.max(0, Math.min(1, share)));
    t.appendChild(fill);
    t.appendChild(el('span', 'mid'));
    return t;
  }

  function basisLine(W, g){
    var sw = snapshotWeek(W);
    var d = el('div', 'pt-basis');
    var so = shareFor(W, g.away, 'off'), sd = shareFor(W, g.home, 'def');
    var share = Math.round(((so + sd) / 2) * 100);
    var txt;
    if (sw === 1){
      txt = '<b>' + D.prior + ' baseline.</b> No ' + D.season + ' games have been played, so every rating is ' +
        'last season\u2019s number regressed toward average, with extra regression for a new starting ' +
        'quarterback or coordinator. Hatched bars mean exactly that.';
    } else {
      txt = '<b>Ratings as of week ' + (sw - 1) + ' games.</b> Roughly ' + share + '% of these ratings comes from ' +
        D.season + ' play, the rest from a regressed ' + D.prior + ' baseline. Opponent-adjusted. ' +
        (W > sw ? 'No games have been played since, so this is the latest read.' : '');
    }
    d.innerHTML = txt + ' Tap any row for the numbers behind it.';
    return d;
  }

  // ---- bottom sheet ----------------------------------------------------------

  function openSheet(title, sub){
    var s = $('sheet');
    s.innerHTML = '';
    var head = el('div', 'pt-shead');
    var h = el('div', 'h', title);
    if (sub) h.appendChild(el('small', null, sub));
    head.appendChild(h);
    var x = el('button', 'pt-close', '\u00d7');
    x.type = 'button'; x.setAttribute('aria-label', 'Close');
    x.addEventListener('click', closeSheet);
    head.appendChild(x);
    s.appendChild(head);
    var body = el('div', 'pt-sbody');
    s.appendChild(body);
    s.hidden = false;
    $('scrim').hidden = false;
    x.focus();
    return body;
  }
  function closeSheet(){
    $('sheet').hidden = true;
    $('sheet').innerHTML = '';
    $('scrim').hidden = true;
  }
  $('scrim').addEventListener('click', closeSheet);
  ROOT.addEventListener('keydown', function(ev){ if (ev.key === 'Escape' && !$('sheet').hidden) closeSheet(); });

  function openDetail(W, off, dfn, b){
    var body = openSheet(b.label + ': ' + off + ' offense vs ' + dfn + ' defense', 'Week ' + W);
    body.appendChild(el('div', 'pt-status', 'Loading\u2026'));
    ensureWeek(W).then(function(){
      body.innerHTML = '';
      var uo = unitFor(W, off, 'off'), ud = unitFor(W, dfn, 'def'), L = leagueFor(W);
      var e = edgeOf(W, off, dfn, b.key);
      var det = DETAIL[b.key];

      // Edge summary
      var sec = el('div', 'pt-sec');
      var n = el('div', 'pt-note');
      n.innerHTML = '<b>' + edgeWord(e.e) + '.</b> ' + off + ' offense ranks <b>' + ord(e.o[1]) + '</b> and ' +
        dfn + ' defense ranks <b>' + ord(e.d[1]) + '</b> in ' + b.label.toLowerCase() + '. ' +
        Math.round(e.o[3] * 100) + '% of the offense rating and ' + Math.round(e.d[3] * 100) +
        '% of the defense rating come from ' + D.season + ' games; the rest is the regressed ' + D.prior + ' baseline.';
      sec.appendChild(n);
      body.appendChild(sec);

      // Dumbbells: each component metric, offense value and defense-allowed value
      // on one axis with the league average marked.
      sec = el('div', 'pt-sec');
      sec.appendChild(el('div', 'pt-stitle', 'The numbers behind the rank'));
      det.parts.forEach(function(part){
        sec.appendChild(dumbbell(part, uo, ud, L, off, dfn));
      });
      body.appendChild(sec);

      // Trend: battle score by as-of week for both units.
      if (D.snapshot_weeks.length > 1){
        sec = el('div', 'pt-sec');
        sec.appendChild(el('div', 'pt-stitle', 'Rating by week'));
        sec.appendChild(trendChart(b.key, off, dfn, W));
        var tn = el('div', 'pt-note');
        tn.innerHTML = 'Score is standard deviations from league average, positive is better for the unit. ' +
          'Week 1 is the ' + D.prior + ' baseline; each later point adds that week\u2019s games.';
        sec.appendChild(tn);
        body.appendChild(sec);
      }

      // Tendency versus counter.
      if (det.pairs.length){
        sec = el('div', 'pt-sec');
        sec.appendChild(el('div', 'pt-stitle', 'Tendency vs counter'));
        sec.appendChild(pairsTable(det.pairs, uo, ud, off, dfn));
        var pn = el('div', 'pt-note');
        pn.textContent = 'Rate rows: for the offense, how often it has faced the thing; for the defense, how often it does it. ' +
          'EPA rows: the offense\u2019s EPA per play against it; the defense\u2019s EPA allowed while doing it. ' +
          'A dash means fewer than ' + MIN_SPLIT + ' plays this season, so the split is still mostly baseline.';
        sec.appendChild(pn);
        body.appendChild(sec);
      }

      // Data basis
      sec = el('div', 'pt-sec');
      var bn = el('div', 'pt-note');
      bn.innerHTML = '<b>Data:</b> ' + off + ' offense ' + uo.g + ' game' + (uo.g === 1 ? '' : 's') + ', ' +
        dfn + ' defense ' + ud.g + ' game' + (ud.g === 1 ? '' : 's') + ' in ' + D.season + '. ' +
        'Headline metrics are opponent-adjusted; splits are not. Last-season numbers are shown for reference only.';
      sec.appendChild(bn);
      body.appendChild(sec);
    }).catch(function(err){
      body.innerHTML = '';
      body.appendChild(el('div', 'pt-status', 'Could not load that week\u2019s detail.'));
      if (window.console) console.error('[matchup]', err);
    });
  }

  function svg(w, h){
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    s.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    s.setAttribute('role', 'img');
    return s;
  }
  function node(tag, attrs, text){
    var n = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var k in attrs) if (attrs.hasOwnProperty(k)) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }
  var INK = '#111', RED = '#cc0000', G1 = '#7f8c9a', G2 = '#b0bec5', B2 = '#dde2e8';

  // One metric on one axis: league average at the centre tick, the offense's
  // value and the defense's allowed value as two dots joined by a bar. For a
  // higher-is-better metric a dot to the right is good for the offense and bad
  // for the defense, which is exactly the tension the row is there to show.
  function dumbbell(part, uo, ud, L, off, dfn){
    var m = part[0], label = part[1], kind = part[2];
    var mo = uo.m[m], md = ud.m[m];
    var lo = L.off[m], ld = L.def[m];
    var mean = lo[0], sd = Math.max(lo[1], ld[1], 1e-6);
    var W = 320, H = 54, x0 = 12, x1 = W - 12, cx = (x0 + x1) / 2;
    var spread = 2.6 * sd;           // axis spans about +/- 2.6 sd
    function X(v){ return Math.max(x0, Math.min(x1, cx + (v - mean) / spread * (x1 - x0) / 2)); }
    var box = el('div', 'pt-chart');
    var s = svg(W, H);
    s.appendChild(node('text', {x:x0, y:12, 'font-size':'10', 'font-weight':'700', fill:INK}, label.toUpperCase()));
    s.appendChild(node('text', {x:x1, y:12, 'font-size':'9', fill:G1, 'text-anchor':'end'}, 'Avg ' + fmtRate(mean, kind)));
    s.appendChild(node('line', {x1:x0, y1:34, x2:x1, y2:34, stroke:B2, 'stroke-width':'2'}));
    s.appendChild(node('line', {x1:cx, y1:26, x2:cx, y2:42, stroke:INK, 'stroke-width':'2'}));
    var vo = mo[0], vd = md[0];
    if (vo != null && vd != null){
      s.appendChild(node('line', {x1:X(vo), y1:34, x2:X(vd), y2:34, stroke:G2, 'stroke-width':'4'}));
    }
    if (vo != null){
      s.appendChild(node('circle', {cx:X(vo), cy:34, r:6, fill:RED}));
      s.appendChild(node('text', {x:X(vo), y:52, 'font-size':'10', 'font-weight':'700', fill:RED, 'text-anchor':'middle'},
        off + ' ' + fmtRate(vo, kind) + (mo[3] ? ' (' + ord(mo[3]) + ')' : '')));
    }
    if (vd != null){
      s.appendChild(node('circle', {cx:X(vd), cy:34, r:6, fill:INK}));
      s.appendChild(node('text', {x:X(vd), y:24, 'font-size':'10', 'font-weight':'700', fill:INK, 'text-anchor':'middle'},
        dfn + ' ' + fmtRate(vd, kind) + (md[3] ? ' (' + ord(md[3]) + ')' : '')));
    }
    box.appendChild(s);
    var note = el('div', 'pt-note');
    var raw = (mo[2] || md[2])
      ? 'Raw ' + D.season + ': ' + off + ' ' + fmtRate(mo[1], kind) + ' on ' + mo[2] + ' plays, ' +
        dfn + ' ' + fmtRate(md[1], kind) + ' allowed on ' + md[2] + '. '
      : 'No ' + D.season + ' plays yet. ';
    note.innerHTML = raw + D.prior + ': ' + off + ' ' + fmtRate(mo[4], kind) + ', ' + dfn + ' ' + fmtRate(md[4], kind) + '.';
    box.appendChild(note);
    return box;
  }

  function trendChart(key, off, dfn, W){
    var to = D.trend[off].off[key], td = D.trend[dfn].def[key];
    var weeks = D.snapshot_weeks;
    var n = weeks.length;
    var Wd = 320, H = 110, x0 = 30, x1 = Wd - 10, y0 = 10, y1 = H - 20;
    var vals = to.concat(td);
    var lo = Math.min(-1, Math.min.apply(null, vals)), hi = Math.max(1, Math.max.apply(null, vals));
    function X(i){ return n === 1 ? (x0 + x1) / 2 : x0 + (x1 - x0) * i / (n - 1); }
    function Y(v){ return y1 - (v - lo) / (hi - lo) * (y1 - y0); }
    var box = el('div', 'pt-chart');
    var s = svg(Wd, H);
    s.appendChild(node('line', {x1:x0, y1:Y(0), x2:x1, y2:Y(0), stroke:INK, 'stroke-width':'1'}));
    s.appendChild(node('text', {x:x0 - 4, y:Y(0) + 3, 'font-size':'9', fill:G1, 'text-anchor':'end'}, 'avg'));
    s.appendChild(node('text', {x:x0 - 4, y:y0 + 3, 'font-size':'9', fill:G1, 'text-anchor':'end'}, '+' + hi.toFixed(1)));
    s.appendChild(node('text', {x:x0 - 4, y:y1, 'font-size':'9', fill:G1, 'text-anchor':'end'}, lo.toFixed(1)));
    // Highlight the as-of week the card is showing.
    var sw = snapshotWeek(W), si = weeks.indexOf(sw);
    if (si >= 0) s.appendChild(node('line', {x1:X(si), y1:y0, x2:X(si), y2:y1, stroke:B2, 'stroke-width':'6'}));
    weeks.forEach(function(w, i){
      if (i === 0 || i === n - 1 || (n > 6 && i % 3 === 0) || n <= 6){
        s.appendChild(node('text', {x:X(i), y:H - 6, 'font-size':'9', fill:G1, 'text-anchor':'middle'}, 'Wk' + w));
      }
    });
    function path(arr, color, dash){
      var d = '';
      arr.forEach(function(v, i){ d += (i ? ' L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); });
      var a = {d:d, fill:'none', stroke:color, 'stroke-width':'2.5', 'stroke-linejoin':'round'};
      if (dash) a['stroke-dasharray'] = '4 3';
      s.appendChild(node('path', a));
      arr.forEach(function(v, i){ s.appendChild(node('circle', {cx:X(i), cy:Y(v), r:3, fill:color})); });
    }
    path(to, RED, false);
    path(td, INK, true);
    box.appendChild(s);
    var leg = el('div', 'pt-note');
    leg.innerHTML = '<b style="color:#cc0000">\u2014 ' + off + ' offense</b> &nbsp; <b>- - ' + dfn + ' defense</b>';
    box.appendChild(leg);
    return box;
  }

  function pairsTable(pairs, uo, ud, off, dfn){
    var t = el('table', 'pt-tend');
    var thead = el('thead');
    var hr = el('tr', 'hd');
    hr.innerHTML = '<th></th><th style="text-align:right">' + off + ' off</th><th style="text-align:right">' + dfn + ' def</th>';
    thead.appendChild(hr);
    t.appendChild(thead);
    var tb = el('tbody');
    pairs.forEach(function(p){
      // Row 1: the tendency (a rate) for both units. Row 2: the counter (EPA).
      if (p[0]) tb.appendChild(tendRow(p[2], p[0], 'pct', uo, ud));
      tb.appendChild(tendRow(p[3], p[1], p[1] === 'prsr' ? 'pct' : 'epa', uo, ud));
    });
    t.appendChild(tb);
    return t;
  }
  function tendRow(label, m, kind, uo, ud){
    var tr = el('tr');
    tr.appendChild(el('td', 'lab', label));
    [uo, ud].forEach(function(u){
      var mm = u.m[m];
      var td = el('td', 'n');
      if (!mm || mm[0] == null){
        td.textContent = '\u2013';
      } else if (mm[2] < MIN_SPLIT && D.snapshot_weeks.length > 1){
        td.textContent = '\u2013';
        td.className = 'n thin';
        td.title = mm[2] + ' plays';
      } else {
        td.textContent = fmtRate(mm[0], m === 'ttt' ? 'sec' : kind);
        if (mm[3]) td.appendChild(el('small', null, ord(mm[3])));
      }
      tr.appendChild(td);
    });
    return tr;
  }

  // ---- game picker -----------------------------------------------------------

  function openPicker(){
    var W = STATE.week;
    var body = openSheet('Week ' + W + ' games', 'Red cells favor the offense, gray the defense');
    var sorts = el('div', 'pt-sorts');
    [['time', 'By kickoff'], ['mis', 'Biggest mismatch']].forEach(function(o){
      var b = el('button', 'pt-sort', o[1]);
      b.type = 'button';
      b.setAttribute('aria-pressed', STATE.sort === o[0] ? 'true' : 'false');
      b.addEventListener('click', function(){ STATE.sort = o[0]; openPicker(); });
      sorts.appendChild(b);
    });
    body.appendChild(sorts);
    var key = el('div', 'pt-glkey');
    D.battles.forEach(function(b){ key.appendChild(el('span', null, b.label.slice(0, 4))); });
    body.appendChild(key);
    var games = gamesIn(W).slice();
    if (STATE.sort === 'mis') games.sort(function(a, b){ return mismatch(W, b) - mismatch(W, a); });
    games.forEach(function(g){
      var row = el('button', 'pt-gl');
      row.type = 'button';
      if (g.id === STATE.game) row.setAttribute('aria-current', 'true');
      var nm = el('span', 'nm', g.away + (g.neutral ? ' vs ' : ' at ') + g.home);
      var sub = (g.as != null && g.hs != null) ? 'Final ' + g.as + '-' + g.hs : fmtTime(g);
      nm.appendChild(el('small', null, sub));
      row.appendChild(nm);
      var strip = el('span', 'pt-strip');
      [[g.away, g.home], [g.home, g.away]].forEach(function(pair){
        var r = el('span', 'r');
        r.appendChild(el('span', 't', pair[0] + ' O'));
        D.battles.forEach(function(b){
          var e = edgeOf(W, pair[0], pair[1], b.key);
          var c = el('span', 'c');
          c.style.background = edgeColor(e.e);
          c.title = b.label + ': ' + edgeWord(e.e);
          r.appendChild(c);
        });
        strip.appendChild(r);
      });
      row.appendChild(strip);
      row.appendChild(el('span', 'mis', mismatch(W, g).toFixed(1)));
      row.addEventListener('click', function(){
        STATE.game = g.id; STATE.side = 0;
        closeSheet(); render(); pushHash();
      });
      body.appendChild(row);
    });
    var note = el('div', 'pt-note');
    note.textContent = 'The number on the right totals the ten edges, so the top of the mismatch sort is the game with the most lopsided units, not the most one-sided game.';
    body.appendChild(note);
  }

  // Diverging fill for the picker strips: white at even, Sharp red toward an
  // offense edge, slate toward a defense edge. Scaled on the edge itself rather
  // than on rank, since here the point is distance from even, and every game on
  // the slate uses the same scale.
  function edgeColor(e){
    var t = Math.min(1, Math.abs(e) / 0.8);
    var a = [244, 245, 247], b = e >= 0 ? [204, 0, 0] : [92, 103, 115];
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' +
      Math.round(a[2] + (b[2] - a[2]) * t) + ')';
  }

  // ---- chrome ------------------------------------------------------------------

  function paintPick(g){
    $('pickname').textContent = g ? (g.away + (g.neutral ? ' vs ' : ' at ') + g.home) : 'Pick a game';
    $('wk').textContent = 'Week ' + STATE.week;
    $('prev').disabled = STATE.week <= 1;
    $('next').disabled = STATE.week >= 18;
  }
  function paintSub(){
    var sw = latestWeek();
    var txt = sw === 1
      ? 'Season ' + D.season + '. <b>' + D.prior + ' baseline</b> until week 1 is in the books.'
      : 'Season ' + D.season + '. Ratings through <b>week ' + (sw - 1) + '</b> games. Updated ' + D.generated_utc.slice(0, 10) + '.';
    $('sub').innerHTML = txt;
  }
  function paintFoot(){
    var f = $('foot');
    f.innerHTML = '<details><summary>How to read this</summary>' +
      '<p><b>Ranks</b> are 1 to 32 for the unit named. A defense ranked 3rd is a top defense. ' +
      '<b>Edge</b> is the gap between the offense\u2019s percentile and the defense\u2019s: the bar grows from the middle toward ' +
      'whichever unit holds the advantage, red for the offense, gray for the defense. A full half-track is a 1st-ranked unit against a 32nd.</p>' +
      '<p><b>Overall, Passing, Rushing</b> blend success rate (60%) and EPA per play (40%). <b>Pressure</b> is the rate of dropbacks with ' +
      'pressure allowed or generated. <b>Explosives</b> is the rate of passes of 15+ yards and runs of 10+.</p>' +
      '<p><b>The blend.</b> Every rating mixes this season\u2019s games with last season\u2019s, regressed toward average and fading as the season goes on. ' +
      'Defense is shrunk harder than offense because it is far less predictable year to year, which is why defensive ranks bunch toward the ' +
      'middle early. A new starting quarterback or coordinator cuts the prior further. Headline metrics are adjusted for opponents faced. ' +
      'Faded or hatched bars mean the rating is still mostly baseline. This is a description of performance to date, not a projection.</p>' +
      '</details>';
  }
  function pushHash(){
    var g = gameById(STATE.game);
    if (!g || !window.history || !history.replaceState) return;
    try {
      history.replaceState(null, '', '#w' + STATE.week + '-' + g.away.toLowerCase() + '-' + g.home.toLowerCase());
    } catch (e) {}
  }
  function readHash(){
    var m = /^#w(\d{1,2})-([a-z]{2,3})-([a-z]{2,3})$/.exec(location.hash || '');
    if (!m) return null;
    var w = parseInt(m[1], 10), a = m[2].toUpperCase(), h = m[3].toUpperCase();
    var g = gamesIn(w).filter(function(x){ return x.away === a && x.home === h; })[0];
    return g ? {week: w, game: g.id} : null;
  }
  function firstGame(W){
    var gs = gamesIn(W);
    return gs.length ? gs[0].id : null;
  }
  function setWeek(W){
    STATE.week = Math.max(1, Math.min(18, W));
    STATE.game = firstGame(STATE.week);
    STATE.side = 0;
    render(); pushHash();
  }
  $('prev').addEventListener('click', function(){ setWeek(STATE.week - 1); });
  $('next').addEventListener('click', function(){ setWeek(STATE.week + 1); });
  $('pick').addEventListener('click', openPicker);

  function get(url){
    return fetch(url, {cache:'no-cache'}).then(function(r){
      if (!r.ok) throw new Error(url + ' returned ' + r.status);
      return r.json();
    });
  }

  if (window.ResizeObserver){
    var lastTier = null;
    new ResizeObserver(function(){
      if (!D) return;
      var tier = nameTier() + ':' + (ROOT.clientWidth >= 641 ? 'w' : 'n');
      if (tier === lastTier) return;
      lastTier = tier;
      render();
    }).observe(ROOT);
  }

  get(BASE + 'matchup_index.json').then(function(ix){
    if (!ix.seasons || !ix.seasons.length){
      showStatus('No seasons have matchup data yet.');
      return;
    }
    var season = ix.default || Math.max.apply(null, ix.seasons);
    return get(BASE + 'matchup_' + season + '.json').then(function(blob){
      D = blob;
      paintSub();
      var h = readHash();
      if (h){
        STATE.week = h.week; STATE.game = h.game;
      } else {
        STATE.week = D.current_week || 1;
        STATE.game = firstGame(STATE.week);
      }
      if (!STATE.game){
        showStatus('No games on the schedule for week ' + STATE.week + '.');
        return;
      }
      render();
    });
  }).catch(function(err){
    // render() never runs, so hideServerPreload() is never called and the
    // shortcode table stays on the page as the fallback.
    $('sub').textContent = 'Live data unavailable, showing this week\u2019s table.';
    showStatus('Couldn\u2019t load the live data. The table below still carries this week\u2019s ranks and edges. ' +
      'Reload the page to try the interactive version again.');
    if (window.console) console.error('[matchup]', err);
  });
})();
</script>
