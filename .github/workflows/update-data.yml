name: Update Stats Data

on:
  schedule:
    # Every 30 minutes, every day. Actual source data only changes ~3x/week
    # on a variable schedule (Sun/Mon/Tue/Fri), so we poll frequently and
    # only commit when something has actually changed.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}  # allows manual trigger from the Actions tab

permissions:
  contents: write  # needed to commit updated JSON back to the repo

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run data pull script(s)
        run: |
          python scripts/pull_sheet_data.py

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
          else
            git commit -m "Update stats data [automated]"
            git push
          fi
