name: Update Stats Data

on:
  schedule:
    # Every 30 minutes, every day. Actual source data only changes ~3x/week
    # on a variable schedule (Sun/Mon/Tue/Fri), so we poll frequently and
    # only commit when something has actually changed.
    #
    # GitHub defers scheduled runs under load, so in practice this fires
    # closer to every 1-2 hours. That is fine for a source that changes a
    # few times a week.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      all_seasons:
        description: 'Rebuild every season in config.py, not just the current one'
        type: boolean
        default: false

permissions:
  contents: write  # needed to commit updated JSON back to the repo

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run tests
        run: |
          shopt -s nullglob
          for test in scripts/test_*.py; do
            echo "Running $test"
            python "$test"
          done

      - name: Run all data pull scripts
        env:
          # Service account key that can read the season Google Sheets.
          # If this secret is absent the scripts fall back to reading the
          # sheet anonymously, which only works while it is link-shared.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          # --all is only passed to scripts that advertise it, so the
          # pull_*.py auto-discovery keeps working for scripts that have
          # no concept of seasons.
          for script in scripts/pull_*.py; do
            args=""
            if [ "${{ inputs.all_seasons }}" = "true" ] \
               && python "$script" --help 2>/dev/null | grep -q -- "--all"; then
              args="--all"
              echo "Running $script (all seasons)"
            else
              echo "Running $script"
            fi
            python "$script" $args
          done

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
          else
            git commit -m "Update stats data [automated]"
            git push
          fi
